name: Next.js CI reutilizável

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependências pelo lockfile
        run: npm ci --no-audit --no-fund
      - name: Verificar lint
        run: npm run lint
      - name: Compilar e verificar tipos
        run: npm run build
